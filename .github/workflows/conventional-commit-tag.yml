name: Create new tag from conventional commits

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version
        id: version
        run: echo "result=$(./generateVersion.sh)" >> "$GITHUB_OUTPUT"

      - name: Set tag from generated version
        run: git tag "${{ steps.version.outputs.result }}"

      - name: Push tag
        run: git push origin "${{ steps.version.outputs.result }}"

      - name: Create Relase
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.result }}
          release_name: ${{ steps.version.outputs.result }}
          draft: false
          prerelease: false